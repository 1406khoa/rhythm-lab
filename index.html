<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhythm Lab</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#D9DAD5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#232422" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rhythm Lab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">Rhythm Lab</div>
    <nav class="tabs" role="tablist" aria-label="Mục">
      <button role="tab" data-tab="pulse">Máy nhịp</button>
      <button role="tab" data-tab="practice">Luyện tập</button>
      <button role="tab" data-tab="forms">Cấu trúc</button>
      <button role="tab" data-tab="test">Kiểm tra</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="tab-pulse" class="panel" role="tabpanel"></section>
    <section id="tab-practice" class="panel" role="tabpanel" hidden></section>
    <section id="tab-forms" class="panel" role="tabpanel" hidden></section>
    <section id="tab-test" class="panel" role="tabpanel" hidden></section>
  </main>

  <aside id="logpanel" hidden>
    <div class="lp-head">
      <b>Nhật ký</b><span id="lp-stats"></span>
      <button id="lp-copy" class="chip">Sao chép JSON</button>
      <button id="lp-dl" class="chip">Tải về</button>
      <button id="lp-clear" class="chip">Xóa</button>
    </div>
    <pre id="lp-body"></pre>
  </aside>

  <div id="toast" role="status" aria-live="polite"></div>
  <pre id="selftest" hidden></pre>


  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/vocal-samples.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/log.js"></script>
  <script src="js/core/syllables.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/voices.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/tabs/pulse.js"></script>
  <script src="js/tabs/practice.js"></script>
  <script src="js/tabs/forms.js"></script>
  <script src="js/tabs/test.js"></script>
  <script src="js/logpanel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
